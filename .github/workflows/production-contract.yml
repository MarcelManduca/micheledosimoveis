name: Verify Production Contract

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract:
    name: Verify Production Build Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Project with Node Server Preset
        run: NITRO_PRESET=node-server npm run build

      - name: Verify Production Contract
        run: node scripts/verify-production-contract.mjs
