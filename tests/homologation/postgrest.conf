# Configuração do PostgREST para Homologação em Ambiente Isolado
# As credenciais e parâmetros devem ser fornecidos via variáveis de ambiente ou arquivo local não versionado
db-uri = "$(PGRST_DB_URI)"
db-schemas = "public"
db-anon-role = "anon"
server-port = 3002
jwt-secret = "$(PGRST_JWT_SECRET)"
jwt-cache-max-lifetime = 3600
db-pool = 10
